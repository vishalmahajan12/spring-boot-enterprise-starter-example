# Example configuration for Enterprise Starter
# Copy relevant sections to your application.yml

enterprise:
  starter:
    # Logging Configuration
    logging:
      enabled: true
      level: INFO
      log-request: true
      log-response: true
      log-incoming-request: true
      log-outgoing-request: true
      log-incoming-response: true
      log-outgoing-response: true
      include-headers: true
      include-body: true
      mask-sensitive-data: true
      max-body-length: 10000
      excluded-paths:
        - "/actuator/**"
        - "/health"
        - "/metrics"
      sensitive-fields:
        - "password"
        - "token"
        - "secret"
        - "authorization"
        - "creditCard"
        - "ssn"
        - "accountNumber"
      async-logging: true
      correlation-id-header: "X-Correlation-ID"
      include-service-name: true
      include-consumer-details: true

    # Authentication Configuration
    authentication:
      enabled: true
      type: JWT  # Options: JWT, OAUTH2, API_KEY, BASIC, CUSTOM
      secret-key: "your-secret-key-change-in-production-min-256-bits"
      token-validity-seconds: 3600
      excluded-paths:
        - "/public/**"
        - "/actuator/health"
      operation-rules:
        # Example: restrict operations by role
        "/api/admin/**":
          - "ADMIN"
        "/api/user/**":
          - "USER"
          - "ADMIN"
      enable-rate-limiting: true
      rate-limit-per-minute: 100
      enable-audit-logging: true
      allowed-roles: []  # Empty means all authenticated users allowed
      enable-ip-whitelist: false
      ip-whitelist:
        - "127.0.0.1"
        - "192.168.1.0/24"
      enable-security-headers: true
      
      # API Key Configuration (when type: API_KEY)
      api-keys:
        "your-api-key-1":
          - "USER"
          - "ADMIN"
        "your-api-key-2":
          - "USER"
      api-key-header: "X-API-Key"
      
      # OAuth2 Configuration (when type: OAUTH2)
      oauth2-introspection-url: "https://oauth2-server.com/introspect"
      oauth2-client-id: "your-client-id"
      oauth2-client-secret: "your-client-secret"
      oauth2-validate-token-endpoint: true
      
      # Basic Auth Configuration (when type: BASIC)
      basic-auth-users:
        "admin": "admin123"  # In production, use hashed passwords
        "user": "user123"
      basic-auth-validate-against-file: false
      basic-auth-password-file: "/etc/passwords.properties"

    # Swagger/OpenAPI Configuration
    swagger:
      enabled: true
      title: "My API Documentation"
      description: "API Documentation for My Application"
      version: "1.0.0"
      contact-name: "API Team"
      contact-email: "api@example.com"
      contact-url: "https://example.com"
      exclude-paths:
        - "/actuator/**"
      enable-security-schemes: true
      api-path: "/api/**"

    # Monitoring Configuration
    monitoring:
      enabled: true
      enable-metrics: true
      enable-health-checks: true
      enable-tracing: false
      enable-slow-query-detection: true
      slow-query-threshold-ms: 1000
      enable-error-tracking: true
      custom-health-indicators: []

    # Resilience Configuration (Circuit Breaker & Retry)
    resilience:
      enabled: true

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Application Name (used in logs and metrics)
spring:
  application:
    name: "my-service"

