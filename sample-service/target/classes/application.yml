spring:
  application:
    name: sample-service

server:
  port: 8080

# Enterprise Starter Configuration
enterprise:
  starter:
    # Logging Configuration
    logging:
      enabled: true
      level: INFO
      log-request: true
      log-response: true
      log-incoming-request: true
      log-outgoing-request: true
      log-incoming-response: true
      log-outgoing-response: true
      include-headers: true
      include-body: true
      mask-sensitive-data: true
      max-body-length: 10000
      excluded-paths:
        - "/actuator/**"
        - "/health"
        - "/metrics"
      sensitive-fields:
        - "password"
        - "token"
        - "secret"
        - "authorization"
        - "creditCard"
        - "ssn"
        - "apiKey"
      async-logging: true
      correlation-id-header: "X-Correlation-ID"
      include-service-name: true
      include-consumer-details: true

    # Authentication Configuration
    authentication:
      enabled: true
      type: BASIC  # Options: JWT, API_KEY, BASIC, OAUTH2
      secret-key: "mySecretKey123456789012345678901234567890123456789012345678901234567890"  # 64+ chars
      token-validity-seconds: 3600
      excluded-paths:
        - "/api/public/**"
        - "/api/auth/**"
        - "/actuator/**"
        - "/swagger-ui.html"
        - "/swagger-ui/**"
        - "/swagger-ui/index.html"
        - "/v3/api-docs"
        - "/v3/api-docs/**"
        - "/swagger-resources/**"
        - "/webjars/**"
      operation-rules:
        "/api/admin/**":
          - "ADMIN"
        "/api/user/**":
          - "USER"
          - "ADMIN"
      enable-rate-limiting: true
      rate-limit-per-minute: 10  # Low for testing
      enable-audit-logging: true
      allowed-roles: []  # Empty = all authenticated users allowed
      enable-ip-whitelist: false
      ip-whitelist: []
      enable-security-headers: true
      
      # API Key Configuration (when type: API_KEY)
      api-keys:
        "demo-api-key-123":
          - "USER"
          - "ADMIN"
        "demo-api-key-456":
          - "USER"
      api-key-header: "X-API-Key"
      
      # Basic Auth Configuration (when type: BASIC)
      basic-auth-users:
        "admin": "admin123"
        "user": "user123"
      
      # OAuth2 Configuration (when type: OAUTH2)
      oauth2-introspection-url: ""
      oauth2-client-id: ""
      oauth2-client-secret: ""

    # Swagger Configuration
    swagger:
      enabled: true
      title: "Sample Service API"
      description: "Sample service demonstrating Enterprise Starter features"
      version: "1.0.0"
      contact-name: "Development Team"
      contact-email: "dev@example.com"
      contact-url: "https://example.com"
      exclude-paths:
        - "/actuator/**"
      enable-security-schemes: true
      api-path: "/api/**"

    # Monitoring Configuration
    monitoring:
      enabled: true
      enable-metrics: true
      enable-health-checks: true
      enable-tracing: false
      enable-slow-query-detection: true
      slow-query-threshold-ms: 1000
      enable-error-tracking: true
      expose-prometheus: true
      metrics-path: "/actuator/prometheus"

    # Resilience Configuration
    resilience:
      enabled: true

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    com.yourcompany.starter: DEBUG
    com.yourcompany.sample: INFO
    org.springframework: WARN

